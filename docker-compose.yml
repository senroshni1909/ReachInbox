services:
  # -------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reachinbox_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-reachinbox_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reachinbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reachinbox-network

  # -------------------------------------------------------------------------
  # 2. Redis Cache & BullMQ Message Queue
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-reachinbox_redis_pass}"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-reachinbox_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reachinbox-network

  # -------------------------------------------------------------------------
  # 3. Backend (Express, Prisma, BullMQ Worker & Scheduler)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-reachinbox_secret_2026}@postgres:5432/${POSTGRES_DB:-reachinbox_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-reachinbox_redis_pass}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-dean.prosacco@ethereal.email}
      SMTP_PASS: ${SMTP_PASS:-pfyMsQUR5hzmPuPNAq}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      MAX_EMAILS_PER_HOUR_DEFAULT: ${MAX_EMAILS_PER_HOUR_DEFAULT:-50}
      MIN_DELAY_BETWEEN_EMAILS_SECONDS: ${MIN_DELAY_BETWEEN_EMAILS_SECONDS:-2}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "5000:5000"
    networks:
      - reachinbox-network

  # -------------------------------------------------------------------------
  # 4. Frontend (Vite React + Nginx Reverse Proxy)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./email scheduler
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: reachinbox-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - reachinbox-network

networks:
  reachinbox-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
